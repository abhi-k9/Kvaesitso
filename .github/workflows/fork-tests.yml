# Smoke tests: runs the unit tests on every push, without building the APK. They cover the
# regressions fixed in the fork and some core features (search, icons, backups, calculator).
# The release workflow runs them too, before publishing anything.
# Run them locally with .github/scripts/unit-tests.sh
# This file only exists in the fork, so it never conflicts with upstream changes.
name: Smoke tests (fork)

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          # Robolectric needs Java 21 for recent Android versions
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: .github/scripts/unit-tests.sh

      - name: Print test failures
        if: ${{ failure() }}
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for report in sorted(glob.glob('**/build/test-results/**/*.xml', recursive=True)):
              for case in ET.parse(report).getroot().iter('testcase'):
                  for failure in list(case.iter('failure')) + list(case.iter('error')):
                      print(f"::error::{case.get('classname')}.{case.get('name')}: {failure.get('message', '')[:300]}")
                      print('\n'.join((failure.text or '').splitlines()[:40]))
          EOF

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: '**/build/reports/tests/'
