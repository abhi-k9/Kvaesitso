# Builds a release APK signed with this fork's own key and publishes it as a GitHub release.
# The unit tests (smoke tests) always run, a release is only published if they pass.
# With "build only" it just checks that the code builds (e.g. after merging upstream changes),
# without signing or publishing anything. "Lint" additionally runs Android lint and prints its
# findings.
# This file only exists in the fork, so it never conflicts with upstream changes.
#
# Required repository secrets (same names as the upstream nightly workflow):
#   KEYSTORE              base64 encoded keystore (.jks / .p12)
#   KEYSTORE_PASSWORD     keystore password
#   SIGNING_KEY_ALIAS     alias of the signing key
#   SIGNING_KEY_PASSWORD  password of the signing key (same as KEYSTORE_PASSWORD for PKCS12 keystores)
name: Release APK (fork)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v1.41.0-fork.1 (not needed for build only)'
        required: false
        type: string
      notes:
        description: 'Release notes (optional)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      build_only:
        description: 'Build only, no signing and no release'
        required: false
        type: boolean
        default: false
      lint:
        description: 'Build only, then run lint'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          # AGP's lint and some unit test dependencies need Java 21
          java-version: '21'
          distribution: 'temurin'

      # Fail fast on configuration errors, before spending time on the build
      - name: Validate inputs and signing secrets
        if: ${{ !inputs.build_only && !inputs.lint }}
        run: |
          if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid tag '$TAG'"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          for name in KEYSTORE KEYSTORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE" | base64 -di > "$RUNNER_TEMP/keystore/keystore.jks"
          keytool -list -keystore "$RUNNER_TEMP/keystore/keystore.jks" \
            -storepass:env KEYSTORE_PASSWORD -alias "$SIGNING_KEY_ALIAS" > /dev/null

      - uses: gradle/actions/setup-gradle@v5

      - name: Build APK
        run: |
          # Date based like the upstream version codes (yyyymmddNN), with the hour as NN so that
          # several releases on the same day still have increasing version codes
          VERSION_CODE_OVERRIDE="$(date -u +%Y%m%d%H)"
          export VERSION_CODE_OVERRIDE
          echo "VERSION_CODE_OVERRIDE=$VERSION_CODE_OVERRIDE" >> "$GITHUB_ENV"
          ./gradlew assembleDefaultRelease

      # Also before a release, so that a failing smoke test stops it
      - name: Run unit tests
        run: .github/scripts/unit-tests.sh

      - name: Run lint
        if: ${{ inputs.lint && !cancelled() }}
        # Lint always reports errors (e.g. in the translations), the findings are printed below
        continue-on-error: true
        run: ./gradlew lintRelease :app:app:lintDefaultRelease --continue

      - name: Print lint findings
        if: ${{ inputs.lint && !cancelled() }}
        run: |
          python3 - <<'EOF'
          import collections, glob, os, xml.etree.ElementTree as ET
          workspace = os.environ['GITHUB_WORKSPACE'] + '/'
          issues = []
          for report in sorted(glob.glob('**/build/reports/lint-results-*.xml', recursive=True)):
              for issue in ET.parse(report).getroot().iter('issue'):
                  location = issue.find('location')
                  file = location.get('file', '').replace(workspace, '') if location is not None else ''
                  line = location.get('line', '') if location is not None else ''
                  issues.append((issue.get('severity'), issue.get('id'), f'{file}:{line}', issue.get('message')))
          for (severity, issue_id), count in collections.Counter((i[0], i[1]) for i in issues).most_common():
              print(f'{count:6} {severity:12} {issue_id}')
          print()
          # Translations are managed on Weblate, only count these
          translation_issues = {'MissingTranslation', 'ImpliedQuantity', 'MissingQuantity', 'Typos'}
          for severity, issue_id, location, message in sorted(issues):
              if issue_id not in translation_issues:
                  print(f'{severity}: {issue_id}: {location}: {message}')
          EOF

      # The release build type is signed with the debug key by default, re-sign it with the fork's key
      - name: Sign APK
        if: ${{ !inputs.build_only && !inputs.lint }}
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK="kvaesitso-$TAG.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore/keystore.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$APK" \
            app/app/build/outputs/apk/default/release/app-default-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Remove keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"

      - uses: actions/upload-artifact@v6
        if: ${{ !inputs.build_only && !inputs.lint }}
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Create release
        if: ${{ !inputs.build_only && !inputs.lint }}
        env:
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          {
            if [ -n "$NOTES" ]; then
              printf '%s\n\n' "$NOTES"
            fi
            echo "Built from $GITHUB_SHA (version code $VERSION_CODE_OVERRIDE)."
            echo
            echo "Signed with this fork's key, so it can't be installed over the upstream app."
            echo "To switch: back up in Settings > Backup, uninstall the upstream app, install this APK and restore the backup."
          } > notes.md
          args=()
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md "${args[@]}"
